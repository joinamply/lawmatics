<script>
    window.Webflow ||= [];
    window.Webflow.push(() => {
        // Append a cache-busting query param to the calculator URL
        const calculatorUrlBase = "https://static-assets.lawmatics.com/pricing-calculator/calculator.html";
        const cacheBuster = "_cb=" + Date.now();
        const calculatorUrl = calculatorUrlBase + (calculatorUrlBase.includes("?") ? "&" : "?") + cacheBuster;

        // Create a container for the iframe
        const $calculatorContainer = $('<div id="calculator-embed-container"></div>');
        $('body').append($calculatorContainer);

        // Create the iframe element pointing to the calculator URL
        const $iframe = $('<iframe>', {
            src: calculatorUrl,
            id: 'calculator-embed-iframe',
            style: 'width:100%;min-height:600px;border:none;display:block;',
            allowfullscreen: true,
            loading: 'lazy'
        });

        // Append the iframe to the container
        $calculatorContainer.append($iframe);
    });
</script>
